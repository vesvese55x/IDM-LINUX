name: Film English Windows UI references
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  genuine-english-reference:
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Open unmodified authoritative SEMO application in English
        shell: pwsh
        run: ./.github/film-production/english_windows_reference.ps1
      - name: Preserve actual desktop reference screenshots and receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: film-english-windows-reference-${{ github.run_id }}
          path: out/film-english-windows-reference/
          retention-days: 7
