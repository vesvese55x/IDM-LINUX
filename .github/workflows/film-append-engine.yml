name: Film — append reviewed motor lesson to partial working copy
on:
  push:
    branches: ['film-capture/**']
    paths: ['film_edit/append_engine_lesson.py', '.github/workflows/film-append-engine.yml']
permissions:
  contents: read
  actions: read
jobs:
  append:
    if: contains(github.event.head_commit.message, '[append-engine]')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: '41650573233'
          name: film-joined-completed-chapters
          path: append-sources/previous
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: '41666108309'
          name: film-engine-original-and-evidence
          path: append-sources/engine
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify actual pause/resume/hash and append without re-encoding
        run: |
          command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          python3 -m venv .append-venv
          .append-venv/bin/pip install -q requests
          .append-venv/bin/python -B film_edit/append_engine_lesson.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: film-engine-appended-working-copy
          path: assembled-engine/
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: film-engine-appended-small-receipts
          path: assembled-engine/receipts/
          if-no-files-found: warn
          retention-days: 14
