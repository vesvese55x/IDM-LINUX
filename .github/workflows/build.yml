name: Build & Release

# IDM LINUX (BELGESELSEMO) — CI/CD
# - Her push / PR / manuel tetikleme: AppImage + deb + rpm + Arch (zst) paketleri derlenir,
#   30 gün saklanan "Artifacts" olarak yüklenir (release'e EKLENMEZ).
# - v* etiketi pushlanınca (örn. v1.0.0): 4 paket DRAFT bir GitHub Release'e eklenir.
#   Yayın kararı sende kalır: Releases sayfasından draft'ı düzenleyip "Publish" edersin.

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_ID: idm-linux
  DISPLAY_NAME: IDM LINUX
  VERSION: "1.0.0"
  MAINTAINER: "BELGESELSEMO <vesvese55x@users.noreply.github.com>"

permissions:
  contents: read

jobs:
  source-check:
    name: Kaynak kod kontrolü
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Uygulama kaynak ağacı var mı?
        id: check
        run: |
          FOUND=""
          for f in idm-linux.sh run.sh start.sh idm-linux bin/idm-linux main.py app.py idm_linux.py gui.py; do
            if [ -f "$f" ] || [ -x "$f" ]; then FOUND="$f"; break; fi
          done
          if [ -n "$FOUND" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "Kaynak bulundu: $FOUND"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Uygulama kaynak ağacı bu committe yok — paket adımları atlanacak. Kaynak eklendiğinde AppImage/deb/rpm/zst otomatik derlenecek."
          fi

  appimage:
    name: AppImage (x86_64)
    needs: source-check
    if: needs.source-check.outputs.present == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build AppImage
        run: bash packaging/appimage/build.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: IDM-LINUX-${{ env.VERSION }}-x86_64-AppImage
          path: dist/*.AppImage
          if-no-files-found: error
          retention-days: 30

  deb:
    name: DEB (Debian/Ubuntu, all)
    needs: source-check
    if: needs.source-check.outputs.present == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build .deb
        run: bash packaging/deb/build.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: IDM-LINUX-${{ env.VERSION }}-deb
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 30

  rpm:
    name: RPM (Fedora/openSUSE, noarch)
    needs: source-check
    if: needs.source-check.outputs.present == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install rpm tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rpm

      - name: Build .rpm
        run: bash packaging/rpm/build.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: IDM-LINUX-${{ env.VERSION }}-rpm
          path: dist/*.rpm
          if-no-files-found: error
          retention-days: 30

  arch:
    name: Arch Linux (.pkg.tar.zst)
    needs: source-check
    if: needs.source-check.outputs.present == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: archlinux:base-devel
    steps:
      - name: Prepare container
        run: pacman -Syu --noconfirm git python-pillow

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build package (makepkg)
        run: |
          cp packaging/arch/PKGBUILD .
          useradd -m builder || true
          chown -R builder:builder .
          su builder -c "cd '$PWD' && makepkg -f"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: IDM-LINUX-${{ env.VERSION }}-arch-x86_64
          path: "*.pkg.tar.zst"
          if-no-files-found: error
          retention-days: 30

  release:
    name: GitHub Release (draft)
    needs: [appimage, deb, rpm, arch]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Attach packages to draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: dist/*
