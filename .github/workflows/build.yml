name: "IDM LINUX + IDM SEMO — Build"
on:
  workflow_dispatch:
    inputs:
      build_linux:
        description: Build the four existing Linux packages
        type: boolean
        default: true
      build_windows:
        description: Build the no-console Windows EXE and native screenshots
        type: boolean
        default: true
      publish_release:
        description: Publish only after reviewed Linux and Windows validation; main only
        type: boolean
        default: false
  push:
    branches: [main]
concurrency:
  group: idm-linux-build
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      linux: ${{ steps.paths.outputs.linux }}
      windows: ${{ steps.paths.outputs.windows }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: paths
        shell: python
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          LINUX: ${{ inputs.build_linux }}
          WINDOWS: ${{ inputs.build_windows }}
        run: |
          import os, subprocess
          if os.environ['EVENT'] == 'workflow_dispatch':
              linux = os.environ['LINUX'] == 'true'
              windows = os.environ['WINDOWS'] == 'true'
          else:
              before = os.environ['BEFORE']
              if not before or set(before) == {'0'}:
                  paths = subprocess.check_output(['git','ls-files'],text=True).splitlines()
              else:
                  subprocess.run(['git','fetch','--no-tags','--depth=1','origin',before],check=True)
                  paths = subprocess.check_output(['git','diff','--name-only',before,'HEAD'],text=True).splitlines()
              linux = any(p.startswith('src/') or p in ['pyproject.toml','belgeselsemo-idm-linux-installer'] or (p.startswith('packaging/') and not p.startswith('packaging/windows/')) for p in paths)
              windows = any(p == 'belgeselsemo-idm-windows-installer.bat' or p.startswith('packaging/windows/') or p == '.github/workflows/build.yml' for p in paths)
              # Always rebuild the complete five-asset set after a product change.
              linux = windows = linux or windows
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              output.write('linux='+str(linux).lower()+'\nwindows='+str(windows).lower()+'\n')
          print('Linux:',linux,'Windows:',windows)

  build:
    needs: changes
    if: needs.changes.outputs.linux == 'true'
    name: 4'lü Paket Derleme (AppImage/deb/rpm/zst)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4

      - name: Python 3.12 kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sistem bağımlılıkları (rpm, zstd)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rpm zstd file ffmpeg aria2 xvfb xauth python3-tk libtk8.6 libxcb1
          python3 -m pip install pillow

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Bounded Blob and browser-passthrough regressions
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/src"
          python3 -m unittest discover -s src/idm_linux/tests -p test_safe_capture.py -v
          node src/idm_linux/tests/test_browser_capture.cjs
          python3 packaging/rebuild_extensions.py --check
          python3 -m unittest discover -s packaging/tests -v
      - name: Test süiti (mevcut kalite kapısı)
        timeout-minutes: 12
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/src"
          mkdir -p artifacts/linux-gui
          xvfb-run -a -s "-screen 0 1600x1000x24" python3 src/idm_linux/tests/test_suite.py > artifacts/linux-gui/existing-tests.log 2>&1 || { tail -70 artifacts/linux-gui/existing-tests.log; exit 1; }
          tail -10 artifacts/linux-gui/existing-tests.log

      - name: Observe nine real production GUI pages under Xvfb
        timeout-minutes: 6
        run: xvfb-run -a -s "-screen 0 1600x1000x24" python3 packaging/linux/capture_gui.py
      - name: Keep real Linux GUI screenshots and regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-xvfb-gui-evidence
          path: artifacts/linux-gui/
          if-no-files-found: warn

      - name: DEB derle (gdebi-uyumlu postinst)
        run: bash src/idm_linux/packaging/deb/build.sh

      - name: RPM derle
        run: bash src/idm_linux/packaging/rpm/build.sh

      - name: AppImage derle
        run: bash src/idm_linux/packaging/appimage/build.sh

      - name: Arch zst derle (makepkg'siz)
        run: bash src/idm_linux/packaging/arch/build_zst.sh

      - name: Paketleri doğrula
        run: |
          ls -la dist/
          test -f "dist/IDM-LINUX-1.0.0-x86_64.AppImage"
          test -f "dist/idm-linux_1.0.0_all.deb"
          test -f "dist/idm-linux-1.0.0-1.noarch.rpm"
          test -f "dist/idm-linux-1.0.0-1-any.pkg.tar.zst"
          echo "4/4 paket hazır ✓"
          # DEB: eski dpkg/gdebi/GNOME-Software uyumluluğu için xz ZORUNLU
          # (runner dpkg'si varsayılan zstd'ye geçti — o paketler eski sistemlerde bozuk görünür)
          DEB_INFO=$(file dist/idm-linux_1.0.0_all.deb)
          echo "$DEB_INFO"
          echo "$DEB_INFO" | grep -q "data compression xz" || { echo "HATA: deb xz sıkıştırmalı değil — eski dpkg'ler açamaz"; exit 1; }
          # RPM: header + dosya listesi okunabilir mi
          rpm -q --info -p dist/idm-linux-1.0.0-1.noarch.rpm
          # ZST (ALPM): makepkg-uyumlu metadata — .PKGINFO ve .MTREE İLK iki giriş olmalı
          # (pamac 'geçersiz veya bozuk paket' hatasının kök nedeni eksik .MTREE idi)
          ZST_LIST=$(zstd -dc dist/idm-linux-1.0.0-1-any.pkg.tar.zst | tar -tf -)
          echo "$ZST_LIST" | head -4
          [ "$(echo "$ZST_LIST" | head -1)" = ".PKGINFO" ] || { echo "HATA: .PKGINFO ilk giriş değil/yok"; exit 1; }
          [ "$(echo "$ZST_LIST" | sed -n 2p)" = ".MTREE" ] || { echo "HATA: .MTREE ikinci giriş değil/yok — pamac paketi reddeder"; exit 1; }
          echo "paket doğrulaması (deb-xz / rpm-header / zst-metadata) ✓"

      - name: Keep the four verified Linux packages (do not publish yet)
        uses: actions/upload-artifact@v4
        with:
          name: linux-release-candidates
          path: |
            dist/IDM-LINUX-1.0.0-x86_64.AppImage
            dist/idm-linux_1.0.0_all.deb
            dist/idm-linux-1.0.0-1.noarch.rpm
            dist/idm-linux-1.0.0-1-any.pkg.tar.zst
          if-no-files-found: error

  windows:
    name: IDM SEMO x64 EXE + real Windows GUI screenshots
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build from the authoritative BAT (GUI subsystem, custom icon)
        shell: powershell
        run: ./packaging/windows/build.ps1
      - name: Native browser layout tests and ten real GUI pages
        shell: powershell
        run: ./packaging/windows/capture.ps1
      - name: Verify no visible CMD or PowerShell window during EXE startup
        shell: powershell
        run: ./packaging/windows/smoke.ps1
      - name: Keep build, screenshots and verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: IDM-SEMO-1.0.0-x86_64
          path: |
            artifacts/windows/IDM-SEMO-1.0.0-x86_64.exe
            artifacts/windows/*manifest.json
            artifacts/windows/*smoke.json
            artifacts/windows/*.log
            promo/assets/screens/idm-semo/
      # Screenshots stay in the CI evidence artifact. Do not auto-push source/doc
      # commits while the other platform's quality gate may still be failing.

  publish:
    name: Replace the same five assets only after both platforms pass
    needs: [build, windows]
    if: needs.build.result == 'success' && needs.windows.result == 'success' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish_release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-release-candidates
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: IDM-SEMO-1.0.0-x86_64
          path: windows-candidates
      - name: Stage exactly the authoritative Windows EXE
        run: |
          set -euo pipefail
          found=$(find windows-candidates -type f -name 'IDM-SEMO-1.0.0-x86_64.exe')
          test "$(printf '%s\n' "$found" | grep -c .)" -eq 1
          cp "$found" release-assets/IDM-SEMO-1.0.0-x86_64.exe
          python3 packaging/publish_existing_release.py release-assets --verify-only
      - name: Backup, replace, verify; no version or tag changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 packaging/publish_existing_release.py release-assets --backup release-backup
      - name: Preserve pre-publication assets and integrity manifests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-publication-backup-and-evidence
          path: |
            release-backup/
            release-assets/build-sha256.json
          if-no-files-found: warn
