# IDM LINUX (BELGESELSEMO) — 1.0.0 paket yenileme akışı (GEÇİCİ)
# Görev: ilk-açılış sihirbazı düzeltmesiyle 4 paketi yeniden derler ve
# mevcut v1.0.0 release'inin asset'lerini GÜNCELLER (eskisiyle değiştirir).
name: "IDM-LINUX-1.0.0 Building (İnşa Ediliyor)"

on:
  workflow_dispatch:

concurrency:
  group: final-build-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_ID: idm-linux
  DISPLAY_NAME: IDM LINUX
  VERSION: "1.0.0"
  MAINTAINER: "BELGESELSEMO <vesvese55x@users.noreply.github.com>"

permissions:
  contents: write

jobs:
  appimage:
    name: AppImage (x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build AppImage
        run: bash packaging/appimage/build.sh

      - name: Paket içi doğrulama (GUI sihirbazı varsayılanı)
        run: |
          cd dist && chmod +x IDM-LINUX-*.AppImage
          ./IDM-LINUX-1.0.0-x86_64.AppImage --appimage-extract usr/bin/idm-linux >/dev/null
          grep -q "set -- install" squashfs-root/usr/bin/idm-linux
          echo "AppImage doğrulandı: argümansız açılış GUI sihirbazını başlatır"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: IDM-LINUX-${{ env.VERSION }}-x86_64-AppImage
          path: dist/*.AppImage
          if-no-files-found: error
          retention-days: 30

  deb:
    name: DEB (Debian/Ubuntu, all)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build .deb
        run: bash packaging/deb/build.sh

      - name: Paket içi doğrulama
        run: |
          dpkg-deb -I dist/*.deb | grep -q "python3-tk"
          dpkg-deb -x dist/*.deb /tmp/debcheck
          grep -q "set -- install" /tmp/debcheck/usr/bin/idm-linux
          test -L /tmp/debcheck/usr/bin/IDM-LINUX
          test -L /tmp/debcheck/usr/bin/IDM-Linux
          echo "deb doğrulandı: tkinter bağımlılığı + GUI sihirbazı varsayılanı + büyük harf kısayolları"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: IDM-LINUX-${{ env.VERSION }}-deb
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 30

  rpm:
    name: RPM (Fedora/openSUSE, noarch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install rpm tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rpm

      - name: Build .rpm
        run: bash packaging/rpm/build.sh

      - name: Paket içi doğrulama
        run: |
          rpm -qpl dist/*.rpm | grep -q "/usr/bin/IDM-LINUX"
          rpm -qp --requires dist/*.rpm | grep -q "python3-tkinter"
          echo "rpm doğrulandı: tkinter bağımlılığı + büyük harf kısayolları"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: IDM-LINUX-${{ env.VERSION }}-rpm
          path: dist/*.rpm
          if-no-files-found: error
          retention-days: 30

  arch:
    name: Arch Linux (.pkg.tar.zst)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: archlinux:base-devel
    steps:
      - name: Prepare container
        run: pacman -Syu --noconfirm git python-pillow

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build package (makepkg)
        run: |
          useradd -m builder || true
          chown -R builder:builder .
          # makepkg, PKGBUILD'in bulunduğu packaging/arch/ içinde koşar; böylece
          # pkg/ ve src/ çalışma dizinleri repo köküyle karışmaz.
          # --nodeps: wine yalnızca ÇALIŞMA anında gereken bağımlılıktır.
          su builder -c "cd '$PWD/packaging/arch' && makepkg -f --nodeps"
          mv packaging/arch/*.pkg.tar.zst ./

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: IDM-LINUX-${{ env.VERSION }}-arch-x86_64
          path: "*.pkg.tar.zst"
          if-no-files-found: error
          retention-days: 30

  release:
    name: "Release: IDM-LINUX-1.0.0 (asset güncelleme)"
    needs: [appimage, deb, rpm, arch]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Paketleri listele ve doğrula
        run: |
          ls -lh dist
          test -f "dist/IDM-LINUX-1.0.0-x86_64.AppImage"
          test -f "dist/idm-linux_1.0.0_all.deb"
          test -f "dist/idm-linux-1.0.0-1.noarch.rpm"
          test -f "dist/idm-linux-1.0.0-1-any.pkg.tar.zst"

      - name: v1.0.0 release asset'lerini güncelle (eskiyle değiştir)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth status
          for f in "IDM-LINUX-1.0.0-x86_64.AppImage" "idm-linux_1.0.0_all.deb" \
                   "idm-linux-1.0.0-1.noarch.rpm" "idm-linux-1.0.0-1-any.pkg.tar.zst"; do
            gh release delete-asset v1.0.0 "$f" --yes --repo "$GITHUB_REPOSITORY" || true
          done
          gh release upload v1.0.0 dist/* --clobber --repo "$GITHUB_REPOSITORY"
          echo "Asset'ler güncellendi."

      - name: Release notlarını güncelle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/notes.md <<'NOTES'
          ## 🚀 IDM LINUX 1.0.0 (BELGESELSEMO)

          Internet Download Manager'ı Linux'ta **tam işlevsel** kullanan entegrasyon katmanının ilk sürümü.

          ### 🧙 İlk açılış sihirbazı (paket yenilendi)
          Paketi kurduktan sonra menüden **IDM LINUX** girdisini aç — **Kurulum & Kontrol Merkezi** (GUI sihirbazı) IDM'nin Wine'a kurulumunu, tarayıcı CRX3/Native Messaging kaydını ve eksik araçları (yt-dlp/ffmpeg/aria2c) tamamlar. GUI garantisi için paketler artık **tkinter** bağımlılığını da kurar; `IDM-LINUX` / `IDM-Linux` komut kısayolları da eklenmiştir.

          ### 📦 Paketler
          | Dosya | Dağıtım |
          |---|---|
          | `IDM-LINUX-1.0.0-x86_64.AppImage` | Evrensel — kurulum gerektirmez |
          | `idm-linux_1.0.0_all.deb` | Debian · Ubuntu · Mint |
          | `idm-linux-1.0.0-1.noarch.rpm` | Fedora · openSUSE · RHEL |
          | `idm-linux-1.0.0-1-any.pkg.tar.zst` | Arch · Manjaro |

          ### ⚡ Kurulum
          ```bash
          # AppImage
          chmod +x IDM-LINUX-1.0.0-x86_64.AppImage
          ./IDM-LINUX-1.0.0-x86_64.AppImage

          # deb
          sudo apt install ./idm-linux_1.0.0_all.deb

          # rpm
          sudo dnf install ./idm-linux-1.0.0-1.noarch.rpm

          # Arch
          sudo pacman -U idm-linux-1.0.0-1-any.pkg.tar.zst
          ```

          ### 🔧 Gereksinimler
          Wine + Python 3 (GUI sihirbazı için tkinter; paket yöneticileri bağımlılıkları otomatik kurar; AppImage'da sistem Wine'ı kullanılır).

          ---
          İndirmelerin bütünlüğü CI'da doğrulanmıştır: 4 paket de 1.0.0 sürümüyle üretilmiştir (tarayıcı eklentileri dahil) ve paket içi sihirbaz varsayılanı CI'da test edilmiştir.
          NOTES
          gh release edit v1.0.0 --title "IDM-LINUX-1.0.0" --notes-file /tmp/notes.md --repo "$GITHUB_REPOSITORY"
          echo "Release notları güncellendi."
