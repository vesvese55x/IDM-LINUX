# IDM LINUX (BELGESELSEMO) — 1.0.0 final sürüm akışı
# Bu, repodaki SON workflow'dur: 4 paketi derler ve "IDM-LINUX-1.0.0"
# adlı DRAFT release'e ekler. Yayın kararı kullanıcıdadır (Publish).
name: "IDM-LINUX-1.0.0 Building (İnşa Ediliyor)"

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: final-build-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_ID: idm-linux
  DISPLAY_NAME: IDM LINUX
  VERSION: "1.0.0"
  MAINTAINER: "BELGESELSEMO <vesvese55x@users.noreply.github.com>"

permissions:
  contents: write

jobs:
  appimage:
    name: AppImage (x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build AppImage
        run: bash packaging/appimage/build.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: IDM-LINUX-${{ env.VERSION }}-x86_64-AppImage
          path: dist/*.AppImage
          if-no-files-found: error
          retention-days: 30

  deb:
    name: DEB (Debian/Ubuntu, all)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build .deb
        run: bash packaging/deb/build.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: IDM-LINUX-${{ env.VERSION }}-deb
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 30

  rpm:
    name: RPM (Fedora/openSUSE, noarch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install rpm tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rpm

      - name: Build .rpm
        run: bash packaging/rpm/build.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: IDM-LINUX-${{ env.VERSION }}-rpm
          path: dist/*.rpm
          if-no-files-found: error
          retention-days: 30

  arch:
    name: Arch Linux (.pkg.tar.zst)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: archlinux:base-devel
    steps:
      - name: Prepare container
        run: pacman -Syu --noconfirm git python-pillow

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build package (makepkg)
        run: |
          useradd -m builder || true
          chown -R builder:builder .
          # makepkg, PKGBUILD'in bulunduğu packaging/arch/ içinde koşar; böylece
          # pkg/ ve src/ çalışma dizinleri repo köküyle karışmaz.
          # --nodeps: wine yalnızca ÇALIŞMA anında gereken bağımlılıktır.
          su builder -c "cd '$PWD/packaging/arch' && makepkg -f --nodeps"
          mv packaging/arch/*.pkg.tar.zst ./

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: IDM-LINUX-${{ env.VERSION }}-arch-x86_64
          path: "*.pkg.tar.zst"
          if-no-files-found: error
          retention-days: 30

  release:
    name: "Release: IDM-LINUX-1.0.0"
    needs: [appimage, deb, rpm, arch]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Paketleri listele
        run: ls -lh dist

      - name: IDM-LINUX-1.0.0 draft release'e ekle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "IDM-LINUX-1.0.0"
          draft: true
          files: dist/*
          body: |
            ## 🚀 IDM LINUX 1.0.0 (BELGESELSEMO)

            Internet Download Manager'ı Linux'ta **tam işlevsel** kullanan entegrasyon katmanının ilk sürümü.

            ### 📦 Paketler
            | Dosya | Dağıtım |
            |---|---|
            | `IDM-LINUX-1.0.0-x86_64.AppImage` | Evrensel — kurulum gerektirmez |
            | `idm-linux_1.0.0_all.deb` | Debian · Ubuntu · Mint |
            | `idm-linux-1.0.0-1.noarch.rpm` | Fedora · openSUSE · RHEL |
            | `idm-linux-1.0.0-1-any.pkg.tar.zst` | Arch · Manjaro |

            ### ⚡ Kurulum
            ```bash
            # AppImage
            chmod +x IDM-LINUX-1.0.0-x86_64.AppImage
            ./IDM-LINUX-1.0.0-x86_64.AppImage

            # deb
            sudo apt install ./idm-linux_1.0.0_all.deb

            # rpm
            sudo dnf install ./idm-linux-1.0.0-1.noarch.rpm

            # Arch
            sudo pacman -U idm-linux-1.0.0-1-any.pkg.tar.zst
            ```

            ### 🔧 Gereksinimler
            Wine + Python 3.9+ (paket yöneticileri bağımlılıkları otomatik kurar; AppImage'da sistem Wine'ı kullanılır).

            ---
            İndirmelerin bütünlüğü CI'da doğrulanmıştır: 4 paket de 1.0.0 sürümüyle üretilmiştir (tarayıcı eklentileri dahil).
