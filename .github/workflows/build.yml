name: "IDM LINUX + IDM SEMO — Build"
on:
  workflow_dispatch:
    inputs:
      build_linux:
        description: Build the four existing Linux packages
        type: boolean
        default: true
      build_windows:
        description: Build the no-console Windows EXE and native screenshots
        type: boolean
        default: true
  push:
    branches: [main]
concurrency:
  group: idm-linux-build
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      linux: ${{ steps.paths.outputs.linux }}
      windows: ${{ steps.paths.outputs.windows }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: paths
        shell: python
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          LINUX: ${{ inputs.build_linux }}
          WINDOWS: ${{ inputs.build_windows }}
        run: |
          import os, subprocess
          if os.environ['EVENT'] == 'workflow_dispatch':
              linux = os.environ['LINUX'] == 'true'
              windows = os.environ['WINDOWS'] == 'true'
          else:
              before = os.environ['BEFORE']
              if not before or set(before) == {'0'}:
                  paths = subprocess.check_output(['git','ls-files'],text=True).splitlines()
              else:
                  subprocess.run(['git','fetch','--no-tags','--depth=1','origin',before],check=True)
                  paths = subprocess.check_output(['git','diff','--name-only',before,'HEAD'],text=True).splitlines()
              linux = any(p.startswith('src/') or p in ['pyproject.toml','belgeselsemo-idm-linux-installer'] or (p.startswith('packaging/') and not p.startswith('packaging/windows/')) for p in paths)
              windows = any(p == 'belgeselsemo-idm-windows-installer.bat' or p.startswith('packaging/windows/') or p == '.github/workflows/build.yml' for p in paths)
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              output.write('linux='+str(linux).lower()+'\nwindows='+str(windows).lower()+'\n')
          print('Linux:',linux,'Windows:',windows)

  build:
    needs: changes
    if: needs.changes.outputs.linux == 'true'
    name: 4'lü Paket Derleme (AppImage/deb/rpm/zst)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4

      - name: Python 3.12 kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sistem bağımlılıkları (rpm, zstd)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rpm zstd file

      - name: Test süiti (kalite kapısı — 208 test)
        timeout-minutes: 12
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/src"
          python3 src/idm_linux/tests/test_suite.py

      - name: DEB derle (gdebi-uyumlu postinst)
        run: bash src/idm_linux/packaging/deb/build.sh

      - name: RPM derle
        run: bash src/idm_linux/packaging/rpm/build.sh

      - name: AppImage derle
        run: bash src/idm_linux/packaging/appimage/build.sh

      - name: Arch zst derle (makepkg'siz)
        run: bash src/idm_linux/packaging/arch/build_zst.sh

      - name: Paketleri doğrula
        run: |
          ls -la dist/
          test -f "dist/IDM-LINUX-1.0.0-x86_64.AppImage"
          test -f "dist/idm-linux_1.0.0_all.deb"
          test -f "dist/idm-linux-1.0.0-1.noarch.rpm"
          test -f "dist/idm-linux-1.0.0-1-any.pkg.tar.zst"
          echo "4/4 paket hazır ✓"
          # DEB: eski dpkg/gdebi/GNOME-Software uyumluluğu için xz ZORUNLU
          # (runner dpkg'si varsayılan zstd'ye geçti — o paketler eski sistemlerde bozuk görünür)
          DEB_INFO=$(file dist/idm-linux_1.0.0_all.deb)
          echo "$DEB_INFO"
          echo "$DEB_INFO" | grep -q "data compression xz" || { echo "HATA: deb xz sıkıştırmalı değil — eski dpkg'ler açamaz"; exit 1; }
          # RPM: header + dosya listesi okunabilir mi
          rpm -q --info -p dist/idm-linux-1.0.0-1.noarch.rpm
          # ZST (ALPM): makepkg-uyumlu metadata — .PKGINFO ve .MTREE İLK iki giriş olmalı
          # (pamac 'geçersiz veya bozuk paket' hatasının kök nedeni eksik .MTREE idi)
          ZST_LIST=$(zstd -dc dist/idm-linux-1.0.0-1-any.pkg.tar.zst | tar -tf -)
          echo "$ZST_LIST" | head -4
          [ "$(echo "$ZST_LIST" | head -1)" = ".PKGINFO" ] || { echo "HATA: .PKGINFO ilk giriş değil/yok"; exit 1; }
          [ "$(echo "$ZST_LIST" | sed -n 2p)" = ".MTREE" ] || { echo "HATA: .MTREE ikinci giriş değil/yok — pamac paketi reddeder"; exit 1; }
          echo "paket doğrulaması (deb-xz / rpm-header / zst-metadata) ✓"

      - name: IDM-LINUX-1.0.0 release'ine yükle (aynı sürüm — asset'ler tazelenir)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v1.0.0 dist/IDM-LINUX-1.0.0-x86_64.AppImage \
            dist/idm-linux_1.0.0_all.deb \
            dist/idm-linux-1.0.0-1.noarch.rpm \
            dist/idm-linux-1.0.0-1-any.pkg.tar.zst \
            --clobber --repo "${GITHUB_REPOSITORY}"
          echo "Release asset'leri (yeni build):"
          gh release view v1.0.0 --repo "${GITHUB_REPOSITORY}" --json assets -q '.assets[] | .name + "  " + (.size|tostring) + " bayt"'

  windows:
    name: IDM SEMO x64 EXE + real Windows GUI screenshots
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build from the authoritative BAT (GUI subsystem, custom icon)
        shell: powershell
        run: ./packaging/windows/build.ps1
      - name: Native browser layout tests and ten real GUI pages
        shell: powershell
        run: ./packaging/windows/capture.ps1
      - name: Verify no visible CMD or PowerShell window during EXE startup
        shell: powershell
        run: ./packaging/windows/smoke.ps1
      - name: Keep build, screenshots and verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: IDM-SEMO-1.0.0-x86_64
          path: |
            artifacts/windows/IDM-SEMO-1.0.0-x86_64.exe
            artifacts/windows/*manifest.json
            artifacts/windows/*smoke.json
            artifacts/windows/*.log
            promo/assets/screens/idm-semo/
      - name: Add Windows EXE without deleting any existing release asset
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference='Stop'
          $file='artifacts/windows/IDM-SEMO-1.0.0-x86_64.exe'
          $name=Split-Path $file -Leaf
          $release=gh release view v1.0.0 --repo $env:GITHUB_REPOSITORY --json assets | ConvertFrom-Json
          if($LASTEXITCODE -ne 0){throw 'Existing v1.0.0 release not accessible'}
          if($release.assets.name -contains $name){
            # Immutable release assets: preserve the original; publish a uniquely named rebuild.
            $suffix=$env:GITHUB_SHA.Substring(0,8)+'-'+$env:GITHUB_RUN_ID
            $name='IDM-SEMO-1.0.0-x86_64-'+$suffix+'.exe'
            $new=Join-Path (Split-Path $file) $name
            Copy-Item $file $new
            $file=$new
          }
          gh release upload v1.0.0 $file --repo $env:GITHUB_REPOSITORY
          if($LASTEXITCODE -ne 0){throw 'Windows asset upload failed; no assets were removed'}
          Write-Host "Published $name without --clobber or delete"
      - name: Publish native Windows screenshots only
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add promo/assets/screens/idm-semo
          if ! git diff --cached --quiet; then
            git commit -m 'docs: refresh native Windows SEMO screenshots [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
