name: Film — real release GUI capture preflight
on:
  push:
    branches: ['film-capture/**']
    paths: ['capture/**', '.github/workflows/film-capture.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: film-capture-${{ github.ref }}
  cancel-in-progress: false
jobs:
  linux:
    if: ${{ !contains(github.event.head_commit.message, '[windows-only]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare a real X11 desktop and capture tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xauth openbox xfdesktop4 xfce4-panel thunar dbus-x11 adwaita-icon-theme xdotool wmctrl scrot ffmpeg python3-tk python3-venv python3-pil fonts-dejavu-core fonts-dejavu-extra fonts-noto-core fonts-liberation locales feh xdg-utils curl
          sudo locale-gen tr_TR.UTF-8
          sudo update-locale LANG=tr_TR.UTF-8
          sudo curl -fsSLo /usr/share/keyrings/brave-browser-archive-keyring.gpg https://brave-browser-apt-release.s3.brave.com/brave-browser-archive-keyring.gpg
          echo 'deb [signed-by=/usr/share/keyrings/brave-browser-archive-keyring.gpg arch=amd64] https://brave-browser-apt-release.s3.brave.com/ stable main' | sudo tee /etc/apt/sources.list.d/brave-browser-release.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq brave-browser
          /usr/bin/python3 -m venv --system-site-packages .capture-venv
          .capture-venv/bin/pip install -q requests pillow pyautogui cryptography websocket-client websockets fonttools
      - name: Prepare declared Wine engine prerequisites on a fresh runner
        if: contains(github.event.head_commit.message, '[wine-engine]')
        run: |
          mkdir -p "$HOME/Downloads" "$HOME/.config"
          printf 'XDG_DOWNLOAD_DIR="$HOME/Downloads"\n' > "$HOME/.config/user-dirs.dirs"
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y -qq wine wine32:i386 wine64 aria2 streamlink yt-dlp curl cabextract p7zip-full xclip
      - name: Record the published Linux AppImage, not a recompiled screenshot harness
        env:
          LANG: tr_TR.UTF-8
          LC_ALL: tr_TR.UTF-8
          LANGUAGE: tr_TR:tr
          DISPLAY: ':99'
          XDG_SESSION_TYPE: x11
          DESKTOP_SESSION: openbox
          FILM_DESKTOP_ONLY: ${{ contains(github.event.head_commit.message, '[desktop-check]') && '1' || '0' }}
          FILM_FUNCTIONAL: '1'
          FILM_WINE_ENGINE_TEST: ${{ contains(github.event.head_commit.message, '[wine-engine]') && '1' || '0' }}
        run: |
          export XAUTHORITY="$RUNNER_TEMP/film.Xauthority"
          touch "$XAUTHORITY"
          chmod 600 "$XAUTHORITY"
          xauth -f "$XAUTHORITY" add :99 . "$(mcookie)"
          Xvfb :99 -screen 0 1920x1080x24 -auth "$XAUTHORITY" -nolisten tcp > /tmp/film-xvfb.log 2>&1 &
          openbox > /tmp/film-openbox.log 2>&1 &
          dbus-run-session -- .capture-venv/bin/python capture/native_probe.py linux
      - name: Save all original recordings and evidence, also on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: film-linux-native-preflight
          path: evidence/
          if-no-files-found: error
          retention-days: 14
  windows:
    if: ${{ !contains(github.event.head_commit.message, '[linux-only]') }}
    name: Windows user GUI (${{ matrix.bootstrap_mode }})
    strategy:
      fail-fast: false
      matrix:
        bootstrap_mode: [click]
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare native Windows automation and desktop recorder
        shell: powershell
        run: |
          python -m pip install --quiet requests pillow pyautogui pywinauto psutil websocket-client
          choco install brave -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Brave installation failed' }
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'ffmpeg installation failed' }
            $env:PATH += ';C:\ProgramData\chocolatey\bin'
          }
      - name: Record the actual published EXE using native desktop capture
        env:
          FILM_DESKTOP_ONLY: ${{ contains(github.event.head_commit.message, '[desktop-check]') && '1' || '0' }}
          FILM_FUNCTIONAL: '1'
          FILM_BOOTSTRAP_MODE: ${{ matrix.bootstrap_mode }}
        shell: powershell
        run: |
          python capture/native_probe.py windows
          if ($LASTEXITCODE -ne 0) { throw 'Native Windows probe failed; inspect evidence' }
      - name: Save all original recordings and evidence, also on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: film-windows-native-preflight-${{ matrix.bootstrap_mode }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14
  source_unit:
    if: ${{ !contains(github.event.head_commit.message, '[capture-only]') }}
    name: Source unit suite (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install fixture dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg python3-tk python3-venv
          /usr/bin/python3 -m venv --system-site-packages .unit-venv
          .unit-venv/bin/pip install -q pytest==8.3.5
      - name: Run original source tests without changing them
        run: |
          mkdir -p evidence
          PYTHONPATH="$PWD/src" /usr/bin/python3 src/idm_linux/tests/test_suite.py > evidence/source-unit-tests.log 2>&1
      - name: Discover all source test modules with pytest — independent of GUI proof
        if: always()
        run: |
          mkdir -p evidence
          PYTHONPATH="$PWD/src" .unit-venv/bin/python -m pytest src/idm_linux/tests -q --junitxml=evidence/source-pytest.xml > evidence/source-pytest.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: film-source-unit-${{ matrix.os }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14
