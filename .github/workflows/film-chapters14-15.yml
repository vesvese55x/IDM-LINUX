name: Film chapters 14-15 — genuine GUI runner
on:
  workflow_dispatch:
    inputs:
      stage:
        description: 'Preparation is not a completed download lesson'
        type: choice
        options: [linux-gui-preflight, linux-native-turkish-preflight, linux-native-fileinfo-turkish-check, linux-native-transfer-turkish-check, linux-native-pixeldrain-capture, windows-native-opening-probe, linux-playlist-owned-backend-check, linux-native-speed-menu-probe, linux-playlist-owned-gui-check]
        default: linux-gui-preflight
      source_page_url:
        description: 'User-authorized public Pixeldrain page URL. Never enter passwords or API keys.'
        type: string
        required: false
        default: ''
      paced_capture:
        description: 'Genuine wall-clock dwell aligned to existing TR voice04 narration; no retiming/frozen UI'
        type: boolean
        default: false
      windows_panel_followup:
        description: 'Observe real automatic panel opening; do not start native IDM installation'
        type: boolean
        default: false
      windows_install_idm:
        description: 'Actual physical Turkish GUI selection and ordinary official native IDM install; no licensing changes'
        type: boolean
        default: false
      windows_launch_cmd:
        description: 'Launch original repository BAT via actual Windows CMD rather than compiled EXE'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: film-production-${{ github.event.inputs.stage }}
  cancel-in-progress: false
jobs:
  genuine-gui-preflight:
    if: github.event.inputs.stage != 'windows-native-opening-probe'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      FILM_PACED_CAPTURE: ${{ github.event.inputs.paced_capture }}
      FILM_SOURCE_PAGE_URL: ${{ github.event.inputs.source_page_url }}
      DISPLAY: ':99'
      TZ: Europe/Istanbul
      LANG: tr_TR.UTF-8
      LC_ALL: tr_TR.UTF-8
      IDM_LINUX_LANG: tr
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Mask runtime source URL in subsequent logs
        run: |
          if [ -n "$FILM_SOURCE_PAGE_URL" ]; then echo "::add-mask::$FILM_SOURCE_PAGE_URL"; fi
      - name: Prepare actual desktop and fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xfce4 xfce4-terminal dbus-x11 xdotool wmctrl imagemagick ffmpeg python3-tk python3-venv fonts-noto-core fonts-noto-cjk fonts-noto-color-emoji locales x11-xserver-utils
          sudo locale-gen tr_TR.UTF-8
          python3 -m venv --system-site-packages .venv-film
          .venv-film/bin/pip install -e . pillow fonttools yt-dlp
      - name: Install official Brave, without credentials
        if: github.event.inputs.stage != 'linux-playlist-owned-backend-check' && github.event.inputs.stage != 'linux-playlist-owned-gui-check'
        run: |
          sudo curl -fsSLo /usr/share/keyrings/brave-browser-archive-keyring.gpg https://brave-browser-apt-release.s3.brave.com/brave-browser-archive-keyring.gpg
          echo 'deb [signed-by=/usr/share/keyrings/brave-browser-archive-keyring.gpg] https://brave-browser-apt-release.s3.brave.com/ stable main' | sudo tee /etc/apt/sources.list.d/brave-browser-release.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq brave-browser
      - name: Prepare normal native Wine installation dependencies
        if: github.event.inputs.stage != 'linux-gui-preflight' && github.event.inputs.stage != 'linux-playlist-owned-backend-check' && github.event.inputs.stage != 'linux-playlist-owned-gui-check'
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo mkdir -pm755 /etc/apt/keyrings
          sudo curl -fsSLo /etc/apt/keyrings/winehq-archive.key https://dl.winehq.org/wine-builds/winehq.key
          sudo curl -fsSLo /etc/apt/sources.list.d/winehq-noble.sources https://dl.winehq.org/wine-builds/ubuntu/dists/noble/winehq-noble.sources
          sudo apt-get update -qq
          sudo apt-get install -y -qq --install-recommends winehq-stable fonts-liberation2 fonts-wqy-zenhei gcc-mingw-w64-i686
          wine --version
          .venv-film/bin/pip install yt-dlp websockets websocket-client requests opencv-python-headless
      - name: Record real read-only control-panel preparation
        run: |
          if [ -n "$FILM_SOURCE_PAGE_URL" ]; then echo "::add-mask::$FILM_SOURCE_PAGE_URL"; fi
          mkdir -p out/film14-preflight
          Xvfb :99 -screen 0 1920x1080x24 -dpi 96 >out/film14-preflight/xvfb.log 2>&1 &
          for n in $(seq 1 40); do xdpyinfo -display :99 >/dev/null 2>&1 && break; sleep .25; done
          printf 'Xft.dpi: 96\nXcursor.size: 24\n' | xrdb -merge
          dbus-run-session -- bash -c '
            xfce4-session >out/film14-preflight/desktop.log 2>&1 &
            sleep 5
            # Use one ordinary non-composited XFWM session for Xvfb recording.
            # Prior root captures retained stale moved-window pixels and missing initial paints.
            xfconf-query -c xfwm4 -p /general/use_compositing --create --type bool -s false
            xfwm4 --replace --compositor=off >out/film14-preflight/window-manager.log 2>&1 &
            sleep 2
            wmctrl -m >out/film14-preflight/actual-window-manager.txt
            xprop -root _NET_SUPPORTING_WM_CHECK >out/film14-preflight/actual-root-wm.txt
            if [ "${{ github.event.inputs.stage }}" = "linux-playlist-owned-gui-check" ]; then
              .venv-film/bin/python .github/film-production/playlist_owned_gui_probe.py || exit $?
            elif [ "${{ github.event.inputs.stage }}" = "linux-playlist-owned-backend-check" ]; then
              .venv-film/bin/python .github/film-production/playlist_owned_source_preflight.py || exit $?
            elif [ "${{ github.event.inputs.stage }}" != "linux-gui-preflight" ]; then
              EXTRA=""
              if [ "${{ github.event.inputs.stage }}" != "linux-native-turkish-preflight" ]; then EXTRA="--isolated-fileinfo"; fi
              .venv-film/bin/python .github/film-production/native_turkish_preflight.py $EXTRA || exit $?
              if [ "${{ github.event.inputs.stage }}" != "linux-native-turkish-preflight" ]; then
                if [ "${{ github.event.inputs.stage }}" = "linux-native-speed-menu-probe" ]; then
                  .venv-film/bin/python .github/film-production/native_speed_menu_probe.py || exit $?
                elif [ "${{ github.event.inputs.stage }}" = "linux-native-pixeldrain-capture" ]; then
                  .venv-film/bin/python .github/film-production/native_pixeldrain_capture.py || exit $?
                else
                TRANSFER=""
                if [ "${{ github.event.inputs.stage }}" = "linux-native-transfer-turkish-check" ]; then TRANSFER="--transfer"; fi
                .venv-film/bin/python .github/film-production/native_fileinfo_turkish.py $TRANSFER || exit $?
                fi
              fi
            else
              .venv-film/bin/python .github/film-production/runner_preflight.py
            fi
          '
      - name: Preserve evidence, not a finished lesson claim
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: film14-genuine-gui-preflight-${{ github.run_id }}
          path: |
            out/film14-preflight/
            out/film14-native-turkish/
            out/film14-playlist-owned/
            out/film14-playlist-gui-owned/*.png
            out/film14-playlist-gui-owned/*.json
            out/film14-playlist-gui-owned/*.txt
            out/film14-playlist-gui-owned/*.mp4
          retention-days: 7
          if-no-files-found: warn

  genuine-windows-opening:
    if: github.event.inputs.stage == 'windows-native-opening-probe'
    runs-on: windows-2022
    env:
      FILM_WINDOWS_LAUNCH_CMD: ${{ github.event.inputs.windows_launch_cmd }}
      FILM_WINDOWS_INSTALL_IDM: ${{ github.event.inputs.windows_install_idm }}
      FILM_WINDOWS_PANEL_FOLLOWUP: ${{ github.event.inputs.windows_panel_followup }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build byte-exact repository launcher without installing IDM
        shell: pwsh
        run: ./packaging/windows/build.ps1
      - name: Install read-only standard Windows accessibility inspector
        shell: pwsh
        run: python -m pip install --disable-pip-version-check pywinauto
      - name: Actual desktop video and original EXE/native wizard, never DrawToBitmap
        shell: pwsh
        run: ./.github/film-production/windows_desktop_recording.ps1
      - name: Keep actual evidence, not a completed installation claim
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: film-native-windows-opening-${{ github.run_id }}
          path: |
            out/film-windows-opening/
            artifacts/windows/build-manifest.json
          retention-days: 7
