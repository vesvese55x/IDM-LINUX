name: capture-13-hoster
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply quality and audio mux fixes with regression assertion
        env:
          PYTHONPATH: src
        run: |
          mkdir -p out
          python -m pip install -e .
          python .github/capture13/apply_quality_fix.py | tee out/regression.txt
          git diff -- src/idm_linux/stream_engine.py > out/quality-fix.patch
          python -m compileall -q src/idm_linux
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bolum13-v7-quality-regression
          path: out/
          retention-days: 7
