name: capture-13-hoster
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  platform-real-captures:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    env:
      DISPLAY: ':99'
      DEBIAN_FRONTEND: noninteractive
      WINEDEBUG: '-all'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fast mirror and bounded desktop dependencies
        timeout-minutes: 15
        run: |
          mkdir -p out
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources
          sudo dpkg --add-architecture i386
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=25 -o Acquire::https::Timeout=25 update -qq
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=25 -o Acquire::https::Timeout=25 install -y --no-install-recommends xvfb openbox ffmpeg xdotool wmctrl imagemagick feh tint2 python3-tk wine64 wine32:i386 wine winbind cabextract fonts-dejavu-core
          curl --retry 2 --connect-timeout 20 -fsSLo /tmp/brave-keyring.gpg https://brave-browser-apt-release.s3.brave.com/brave-browser-archive-keyring.gpg
          sudo install /tmp/brave-keyring.gpg /usr/share/keyrings/brave-browser-archive-keyring.gpg
          echo 'deb [arch=amd64 signed-by=/usr/share/keyrings/brave-browser-archive-keyring.gpg] https://brave-browser-apt-release.s3.brave.com/ stable main' | sudo tee /etc/apt/sources.list.d/brave-browser-release.list
          sudo apt-get -o Acquire::Retries=2 -o Acquire::https::Timeout=25 update -qq
          sudo apt-get -o Acquire::Retries=2 -o Acquire::https::Timeout=25 install -y --no-install-recommends brave-browser
          python -m pip install -e . playwright pillow requests yt-dlp
      - name: Fix source and start desktop
        run: |
          PYTHONPATH=src python .github/capture13/apply_quality_fix.py | tee out/quality-tests.txt
          Xvfb :99 -screen 0 1920x1080x24 >out/xvfb.log 2>&1 &
          sleep 2
          openbox >out/openbox.log 2>&1 &
          sleep 2
      - name: Install official IDM through current IDM Linux
        timeout-minutes: 12
        run: |
          python -m idm_linux.cli install --cli --yes --skip-pkgs 2>&1 | tee out/install-idm.log
          python -m idm_linux.cli status > out/idm-status.txt
      - name: Prepare approved desktop and readable clock
        run: |
          pkill -x brave || true
          feh --bg-fill .github/capture13/wallpaper.png
          mkdir -p /tmp/capture13-tint2
          cat > /tmp/capture13-tint2/tint2rc <<'EOF'
          panel_items = TC
          panel_size = 100% 48
          panel_position = bottom center horizontal
          panel_background_id = 0
          time1_format = %H:%M:%S
          time1_font = DejaVu Sans Bold 12
          time2_format = %d.%m.%Y
          time2_font = DejaVu Sans 10
          clock_padding = 18 3
          clock_font_color = #ffffff 100
          taskbar_mode = single_desktop
          EOF
          tint2 -c /tmp/capture13-tint2/tint2rc >out/taskbar.log 2>&1 &
          /usr/bin/python3 .github/capture13/desktop_card.py >out/system-card.log 2>&1 &
          xdotool key Escape || true
          python -m idm_linux.cli daemon-run >out/daemon.log 2>&1 &
          sleep 6
          EXT="$HOME/.local/share/idm-linux/extensions/chromium"
          test -f "$EXT/manifest.json"
          brave-browser --no-sandbox --no-first-run --disable-dev-shm-usage --remote-debugging-port=9222 --user-data-dir=/tmp/capture13-brave --load-extension="$EXT" --window-position=380,40 --window-size=1500,940 about:blank >out/brave.log 2>&1 &
          sleep 5
      - name: Record OK.ru in Brave through real IDM bar
        id: okru
        continue-on-error: true
        timeout-minutes: 16
        env:
          CAPTURE_SITE: okru
          CAPTURE_URL: https://ok.ru/video/34928855659
        run: python .github/capture13/capture_platform.py
      - name: Record VK in Brave through real IDM bar
        id: vk
        continue-on-error: true
        timeout-minutes: 16
        env:
          CAPTURE_SITE: vk
          CAPTURE_URL: https://vk.com/video-213746495_456239034
        run: python .github/capture13/capture_platform.py
      - name: Record Bilibili in Brave through real IDM bar
        id: bilibili
        continue-on-error: true
        timeout-minutes: 16
        env:
          CAPTURE_SITE: bilibili
          CAPTURE_URL: https://www.bilibili.com/video/BV1xx411c7mD/
        run: python .github/capture13/capture_platform.py
      - name: Enforce truthful stage result
        if: always()
        run: |
          echo "OK.ru: ${{ steps.okru.outcome }}; VK: ${{ steps.vk.outcome }}; Bilibili: ${{ steps.bilibili.outcome }}" | tee out/platform-outcomes.txt
          test '${{ steps.okru.outcome }}' = success
          test '${{ steps.vk.outcome }}' = success
          test '${{ steps.bilibili.outcome }}' = success
      - name: Record failure screenshot if needed
        if: failure()
        run: |
          import -window root out/failure-desktop.png || true
          df -h > out/disk.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bolum13-v7-platform-real-captures
          path: out/
          retention-days: 7
