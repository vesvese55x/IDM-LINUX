# IDM LINUX — uçtan uca test paketi (projenin kendi E2E süitesi)
#
# NOT: test_suite.py içindeki bazı E2E vakaları (HLS canlı bayt, torrent köprüsü,
# tarayıcı penceresi) GitHub runner'larında zamanlama/ekran duyarlıdır; süite
# içindeki "flaky önlemi" yorumları da bunu belirtir. Bu yüzden iş
# continue-on-error ile çalışır: kırmızı X yerine logda görünür, build'i engellemez.
name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-linux:
    name: E2E Testleri (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sistem bağımlılıkları
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb ffmpeg aria2 imagemagick

      - name: E2E test paketi (xvfb ekranı ile)
        env:
          PYTHONPATH: src
        run: xvfb-run -a python -m unittest discover -s tests -p "test_suite.py" -v
