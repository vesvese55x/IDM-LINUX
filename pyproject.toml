[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "idm-linux"
version = "1.0.0"
description = "Internet Download Manager (IDM) Evrensel Linux Kurulum, Resmi com.tonec.idm Protokol Köprüsü, 20-Dilli Kontrol Merkezi ve Hibrit Video Bar Paketi"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
  {name = "BELGESELSEMO"}
]

[project.scripts]
idm-linux = "idm_linux.cli:main"
idm-native-host = "idm_linux.native_host:run_native_messaging_loop"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Yeni depo düzeni: tüm uygulama verileri idm_linux paketi içindedir.
idm_linux = [
  "assets/*.png",
  "extractor_plugins/*/yt_dlp_plugins/extractor/*.py",
  "language/*.txt",
  "bin/*",
  "docs/*.md",
  "IDM-Linux-Kurulum.desktop",
  "install.sh",
  "extension/*.js",
  "extension/*.html",
  "extension/*.json",
  "extension/*.crx",
  "extension/*.zip",
  "extension/*.xpi",
  "extension/chromium/*",
  "extension/chromium/icons/*",
  "extension/firefox/*",
  "extension/firefox/icons/*",
]
